<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal File Converter</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            /* Vivid Blue Palette */
            --primary-color: #007bff; 
            --primary-hover: #0056b3;
            --border-color: #cccccc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --border-color: #444444;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: transparent;
            color: var(--text-color);
            font-family: monospace;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .file-settings {
            display: flex;
            gap: 8px;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="text"] {
            flex: 2;
        }

        select {
            flex: 1;
        }

        /* The Custom Blue Button */
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Universal File Converter</h1>
    
    <textarea id="textContent" placeholder="Type or paste your content here..."></textarea>
    
    <div class="controls">
        <div class="file-settings">
            <input type="text" id="fileNameInput" value="index" placeholder="File name">
            
            <select id="extensionSelect" onchange="handleExtensionChange()">
                <option value=".html">.html</option>
                <option value=".txt">.txt</option>
                <option value=".css">.css</option>
                <option value=".js">.js</option>
                <option value=".json">.json</option>
                <option value=".csv">.csv</option>
                <option value=".py">.py</option>
                <option value=".md">.md</option>
                <option value="custom">Custom...</option>
            </select>
        </div>
        
        <input type="text" id="customExtInput" style="display: none;" placeholder="Type extension (e.g. .bat)">
    </div>

    <button onclick="downloadFile()">Download File</button>
</div>

<script>
    function handleExtensionChange() {
        const select = document.getElementById('extensionSelect');
        const customInput = document.getElementById('customExtInput');
        customInput.style.display = (select.value === 'custom') ? 'block' : 'none';
    }

    function downloadFile() {
        const text = document.getElementById('textContent').value;
        let baseName = document.getElementById('fileNameInput').value.trim() || "untitled";
        const select = document.getElementById('extensionSelect');
        let extension = select.value;

        if (extension === 'custom') {
            let customExt = document.getElementById('customExtInput').value.trim();
            if (customExt && !customExt.startsWith('.')) {
                customExt = '.' + customExt;
            }
            extension = customExt || '.txt'; 
        }

        const finalFileName = baseName + extension;
        const blob = new Blob([text], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        
        link.download = finalFileName;
        link.href = URL.createObjectURL(blob);
        
        document.body.appendChild(link);
        link.click();
        
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }
</script>

</body>
</html>
